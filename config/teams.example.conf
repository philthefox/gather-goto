# Settings for gather-teams-watch (shell syntax). Reload after changes:
#   launchctl kickstart -k gui/$(id -u)/gather-goto.teams-watch
ON_START="customer" # gather-goto target when a Teams call starts; "" = do nothing
ON_END="desk"       # gather-goto target when the call has ended;  "" = do nothing
START_AFTER=3       # seconds Teams must hold the microphone before it counts as a call
END_AFTER=20        # seconds without microphone use before the call counts as ended
